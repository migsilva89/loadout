name: Update the Homebrew cask

# `brew install --cask migsilva89/loadout/loadout` installs whatever version the
# cask in migsilva89/homebrew-loadout names. Nothing kept that file current but
# memory, and memory lost: the cask sat on 0.5.0 — never notarised — through
# four releases, and macOS told everyone who installed it that it could be
# malware (#15).
#
# So publishing a release now rewrites the cask: the version, and the checksum
# of the disk image as GitHub serves it, downloaded rather than taken from the
# machine that built it.
#
# The credential is a deploy key on the tap with write access, its private half
# held here as HOMEBREW_TAP_DEPLOY_KEY. It reaches that one repository only, and
# unlike a token it does not expire. Unlike the site, the cask has no schedule
# of its own to catch up with, so a missing key is a failure, not a warning: a
# red cross is the only way anybody learns the cask did not move.

on:
  release:
    types: [published]
  # For firing it by hand — to repair the cask after a run that failed, or to
  # prove the token still works without cutting a release to find out.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to point the cask at, e.g. v0.6.3"
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Point the cask at the release
        env:
          # Reads this repository's release assets.
          GH_TOKEN: ${{ github.token }}
          # Writes to the tap — the only credential that reaches another repository.
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAP: migsilva89/homebrew-loadout
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_KEY:-}" ]; then
            echo "::error::No HOMEBREW_TAP_DEPLOY_KEY set, so $TAP still names the previous version."
            exit 1
          fi

          VERSION="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Loadout-$VERSION.dmg"
          SHA="$(sha256sum "Loadout-$VERSION.dmg" | cut -d' ' -f1)"

          install -m 600 /dev/null "$RUNNER_TEMP/tap-key"
          printf '%s\n' "$TAP_KEY" > "$RUNNER_TEMP/tap-key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --quiet "git@github.com:$TAP.git" tap
          cd tap
          sed -i -E \
            -e "s/^  version \"[^\"]+\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \"[0-9a-f]+\"/  sha256 \"$SHA\"/" \
            Casks/loadout.rb

          if git diff --quiet; then
            echo "The cask already names $VERSION."
            exit 0
          fi
          git diff
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -am "Update Loadout to $VERSION"
          git push --quiet
          echo "Pointed $TAP at $VERSION."
