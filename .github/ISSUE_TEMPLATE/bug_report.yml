name: Bug report
description: Something behaves differently from what it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Loadout → Acerca de, ou o nome do ficheiro descarregado
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: macOS 15.2, Apple Silicon
    validations:
      required: true
